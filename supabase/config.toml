#:schema https://supabase.com/schemas/config/v1.json
project_id = "classroom-planner"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "4m"
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
# The Studio image shipped with CLI 3.2.0 fails with ERR_INVALID_PACKAGE_CONFIG.
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
minimum_password_length = 10
password_requirements = "letters_digits"
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/confirmar", "http://127.0.0.1:3000/confirmar"]

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no Classroom Planner"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefinir sua senha do Classroom Planner"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Seu convite para o Classroom Planner"
content_path = "./supabase/templates/invite.html"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
# Keep the local stack focused on application services and database tests.
enabled = false
