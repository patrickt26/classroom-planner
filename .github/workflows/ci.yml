name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Varredura de segredos
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  application:
    name: Aplicação
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - name: Iniciar Supabase local com as migrações e o seed fictício
        run: pnpm exec supabase start
      - name: Usar as variáveis públicas do banco descartável no build
        run: |
          pnpm exec supabase status -o json | jq -er '
            "NEXT_PUBLIC_SUPABASE_URL=" + (.API_URL | strings),
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" + (.PUBLISHABLE_KEY | strings)
          ' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SIGNUP_ENABLED=false" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Testar os fluxos no build de produção
        run: |
          E2E_SUPABASE_SECRET_KEY="$(pnpm exec supabase status -o json | jq -er .SECRET_KEY)" pnpm test:e2e

  database:
    name: Banco de dados
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase db reset --local
      - run: pnpm exec supabase test db
